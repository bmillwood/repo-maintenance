on:
  push:
    branches:
    - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - run: uv run --frozen --only-group dev ruff check --output-format github
    # Even if linting failed, so that one run reports both.
    - if: ${{ !cancelled() }}
      run: uv run --frozen --only-group dev ruff format --check
