[project]
name = "repo-maintenance"
version = "0.1.0"
description = "Idempotently apply packages of GitHub configuration"
authors = [
    { name = "Ben Millwood", email = "thebenmachine+git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
repo-maintenance = "repo_maintenance:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.99",
]
